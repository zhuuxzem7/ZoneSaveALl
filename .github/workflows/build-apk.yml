name: Build ZoneSaveALL Android APK

on:
  workflow_dispatch:
    inputs:
      vercel_url:
        description: 'URL Publik Vercel Anda (contoh: https://zonesaveall.vercel.app)'
        required: false
        default: ''
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Universal Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Resolve Backend API URL & Build Web App
        run: |
          RAW_URL="${{ github.event.inputs.vercel_url }}"
          if [ -z "$RAW_URL" ]; then
            RAW_URL="${{ vars.APP_URL }}"
          fi
          if [ -z "$RAW_URL" ]; then
            REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
            RAW_URL="https://${REPO_LOWER}.vercel.app"
          fi
          RAW_URL="${RAW_URL%/}"
          echo "Using API base URL: $RAW_URL"
          npm run build
          API_BASE_VAL="$RAW_URL" node -e '
            const fs = require("fs");
            const p = "dist/index.html";
            const html = fs.readFileSync(p, "utf8");
            const inject = `<script>window.__ZONESAVE_API_BASE__=${JSON.stringify(process.env.API_BASE_VAL || "")};</script>`;
            fs.writeFileSync(p, html.replace("</head>", `${inject}</head>`));
          '

      - name: Setup Capacitor Android (CI Only)
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.zonesaveall.app",
            "appName": "ZoneSaveALL",
            "webDir": "dist",
            "overrideUserAgent": "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android

      - name: Apply ZoneSaveALL Launcher Icons & Download Support
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -f "$dir/ic_launcher.png" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png"
            fi
            if [ -f "$dir/ic_launcher_round.png" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
            fi
            if [ -f "$dir/ic_launcher_foreground.png" ]; then
              cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"
            fi
          done

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#1D4ED8</color>
          </resources>
          EOF

          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("WRITE_EXTERNAL_STORAGE")) {
              xml = xml.replace(
                "</manifest>",
                "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />\n</manifest>"
              );
            }
            if (!xml.includes("android.intent.action.SEND")) {
              xml = xml.replace(
                "</activity>",
                "            <intent-filter>\n                <action android:name=\"android.intent.action.SEND\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <data android:mimeType=\"text/plain\" />\n            </intent-filter>\n        </activity>"
              );
            }
            fs.writeFileSync(p, xml);
          '

          cat << 'EOF' > android/app/src/main/java/com/zonesaveall/app/MainActivity.java
          package com.zonesaveall.app;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (getBridge() != null && getBridge().getWebView() != null) {
                WebView webView = getBridge().getWebView();
                webView.setDownloadListener(new DownloadListener() {
                  @Override
                  public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                    if (url == null || (!url.startsWith("http://") && !url.startsWith("https://"))) {
                      return;
                    }
                    try {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setMimeType(mimeType);
                      String cookies = CookieManager.getInstance().getCookie(url);
                      if (cookies != null) {
                        request.addRequestHeader("cookie", cookies);
                      }
                      request.addRequestHeader("User-Agent", userAgent);
                      String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                      request.setTitle(fileName);
                      request.setDescription("Mengunduh file dari ZoneSaveALL...");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm != null) {
                        dm.enqueue(request);
                        Toast.makeText(getApplicationContext(), "Mengunduh " + fileName, Toast.LENGTH_SHORT).show();
                      }
                    } catch (Exception e) {
                      Toast.makeText(getApplicationContext(), "Gagal memulai unduhan", Toast.LENGTH_SHORT).show();
                    }
                  }
                });

                final Intent initialIntent = getIntent();
                webView.postDelayed(() -> dispatchSharedIntent(initialIntent), 1200);
                webView.postDelayed(() -> dispatchSharedIntent(initialIntent), 2600);
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().post(() -> dispatchSharedIntent(intent));
              }
            }

            private void dispatchSharedIntent(Intent intent) {
              if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) {
                return;
              }
              if (!"text/plain".equals(intent.getType())) {
                return;
              }
              String sharedText = intent.getStringExtra(Intent.EXTRA_TEXT);
              if (sharedText == null || sharedText.trim().isEmpty()) {
                return;
              }
              if (getBridge() == null || getBridge().getWebView() == null) {
                return;
              }
              String quoted = JSONObject.quote(sharedText);
              String js = "(function(t){if(window.__ZONESAVE_LAST_SHARED__!==t){window.__ZONESAVE_LAST_SHARED__=t;window.__ZONESAVE_SHARED_TEXT__=t;window.dispatchEvent(new CustomEvent('zonesave-shared-url',{detail:t}));}})(" + quoted + ");";
              getBridge().getWebView().evaluateJavascript(js, null);
            }
          }
          EOF

          npx cap sync android

      - name: Build Universal Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/ZoneSaveALL.apk

      - name: Upload ZoneSaveALL.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoneSaveALL-APK
          path: release-apk/ZoneSaveALL.apk

      - name: Publish ZoneSaveALL.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: ZoneSaveALL Android APK (Universal)
          body: |
            APK resmi ZoneSaveALL untuk semua HP Android (Android 6.0 - 15+, ARM64 & ARMv7).
            Pastikan web Vercel sudah aktif sebelum menjalankan unduhan media di aplikasi.
          files: release-apk/ZoneSaveALL.apk
